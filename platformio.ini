; PlatformIO Project Configuration File
; Heat Pump Controller — ESP32 dual-board (Controller + Remote)

; ── Shared base ────────────────────────────────────────────
[common]
platform  = espressif32@6.12.0   ; Arduino core 2.x — core 3.x changed the ESP-NOW callback API
board     = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Two 1.9 MB OTA slots. NVS stays at 0x9000 so saved settings survive.
; Changing the table requires one USB flash of each board.
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=0

; ── Controller (outside: relays + sensors + control + ESP-NOW) ─
[env:controller]
extends = common
build_flags =
    ${common.build_flags}
    -DROLE_CONTROLLER

build_src_filter =
    +<*>
    -<main.cpp>
    -<main_remote.cpp>
    -<display.cpp>
    -<buttons.cpp>
    -<menu.cpp>
    -<wifi_mqtt.cpp>
    -<espnow_remote.cpp>
    -<control_remote.cpp>
    -<sensors_remote.cpp>
    -<web.cpp>
    -<ota_remote.cpp>

; ── Remote (inside: display + buttons + menu + WiFi/MQTT + ESP-NOW) ─
[env:remote]
extends = common
build_flags =
    ${common.build_flags}
    -DROLE_REMOTE
    -DMQTT_MAX_PACKET_SIZE=2048

lib_deps =
    olikraus/U8g2@^2.35.19
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    tzapu/WiFiManager@^2.0.17

build_src_filter =
    +<*>
    -<main.cpp>
    -<main_ctrl.cpp>
    -<sensors.cpp>
    -<relays.cpp>
    -<control.cpp>
    -<espnow_ctrl.cpp>
    -<ota_ctrl.cpp>
